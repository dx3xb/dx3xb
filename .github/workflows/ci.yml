name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        project: [., color-hunter, dont-click-wrong, instant-memory, ai-truth-detective]
    defaults:
      run:
        working-directory: ${{ matrix.project }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ${{ matrix.project }}/package-lock.json
      - run: npm ci
      - run: npm run build
      - if: matrix.project == '.'
        run: npm test

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            color-hunter/package-lock.json
            dont-click-wrong/package-lock.json
            instant-memory/package-lock.json
            ai-truth-detective/package-lock.json
      - run: npm ci
      - run: npm ci --prefix color-hunter
      - run: npm ci --prefix dont-click-wrong
      - run: npm ci --prefix instant-memory
      - run: npm ci --prefix ai-truth-detective
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e

  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=moderate
      - run: npm audit --prefix ai-truth-detective --audit-level=moderate
      - run: npm run test:migrations
